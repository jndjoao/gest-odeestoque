<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grupo J Auto App</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f4f5f7;--card:#fff;--tx:#1a1d23;--mut:#6b7280;--bd:#e3e5ea;--ac:#0b1b3f;--acx:#fff;--ok:#15803d;--wa:#b45309;--no:#b91c1c;--okb:#dcfce7;--wab:#fef3c7;--nob:#fee2e2}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f1115;--card:#181b21;--tx:#e8eaee;--mut:#9aa1ad;--bd:#2a2e37;--ac:#60a5fa;--acx:#0b1220;--ok:#4ade80;--wa:#fbbf24;--no:#f87171;--okb:#12301d;--wab:#3a2a0a;--nob:#3b1414}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f1115;--card:#181b21;--tx:#e8eaee;--mut:#9aa1ad;--bd:#2a2e37;--ac:#60a5fa;--acx:#0b1220;--ok:#4ade80;--wa:#fbbf24;--no:#f87171;--okb:#12301d;--wab:#3a2a0a;--nob:#3b1414}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:1100px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:14px}
h1{font-size:20px;margin:0}
nav{display:flex;gap:6px}
nav button,.btn{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:9px 14px;border-radius:8px;font:inherit;cursor:pointer}
nav button.on,.btn.p{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.st{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px}
.st b{display:block;font-size:26px}.st span{color:var(--mut);font-size:13px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:14px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
input,select,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:9px;width:100%}
.bar input{flex:2;min-width:180px}.bar select{flex:1;min-width:130px}
.sc{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:720px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--bd);vertical-align:middle}
th{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
td small{color:var(--mut)}
.tag{padding:3px 9px;border-radius:99px;font-size:12px;font-weight:600;border:0;cursor:pointer}
.disponivel{background:var(--okb);color:var(--ok)}.reservado{background:var(--wab);color:var(--wa)}.vendido{background:var(--nob);color:var(--no)}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
label{font-size:13px;color:var(--mut);display:block;margin-bottom:3px}
h2{font-size:16px;margin:0 0 12px}
.x{background:none;border:0;color:var(--no);cursor:pointer;font:inherit}
.vz{text-align:center;color:var(--mut);padding:24px}
.msg{color:var(--ok);font-size:13px;margin-left:10px}
.hide{display:none}
header{background:#fff;border:1px solid #e3e5ea;border-radius:12px;padding:12px 18px;box-shadow:0 1px 3px rgba(3,11,31,.08)}
.logo{height:34px;width:auto;display:block}
.logo.c{height:44px;margin:4px auto 0}
nav button{background:#fff;color:#0b1b3f;border-color:#d5d9e0;font-weight:500}
nav button.on{background:#0b1b3f;color:#fff;border-color:#0b1b3f}
#lo{color:#6b7280}
#lg{--bg:#f4f5f7;--card:#fff;--tx:#1a1d23;--mut:#6b7280;--bd:#e3e5ea;--ac:#0b1b3f;--acx:#fff;background:#fff;color:#1a1d23;padding:26px;border-radius:14px;box-shadow:0 8px 30px rgba(3,11,31,.12)}
#lg .btn{width:100%;padding:11px}
#lg .msg{display:block;margin:8px 0 0;text-align:center}
.card,.st{box-shadow:0 1px 3px rgba(3,11,31,.06);border-radius:12px}
.st{border-left:4px solid var(--ac)}
.st:nth-child(1){border-left-color:var(--ok)}.st:nth-child(2){border-left-color:var(--wa)}.st:nth-child(3){border-left-color:var(--no)}
.st b{font-size:28px;letter-spacing:-.02em}
h2{font-size:15px;letter-spacing:.01em}
th{background:rgba(127,127,127,.07);font-weight:600}
th:first-child{border-radius:8px 0 0 8px}th:last-child{border-radius:0 8px 8px 0}
tbody tr:hover{background:rgba(127,127,127,.06)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ac);border-color:transparent}
.btn.p{padding:10px 18px}
.foot{text-align:center;color:var(--mut);font-size:12px;padding:6px 0 18px}
@media (max-width:520px){.logo{height:26px}header{padding:10px 12px}}
.by{font-size:11px;color:var(--mut);opacity:.75}
</style>
</head>
<body>
<div class="w">
<section id="lg" class="card" style="max-width:360px;margin:40px auto">
<img class="logo c" src="logo.png" alt="Grupo J Auto App"><h2 style="text-align:center;margin-top:18px">Acesso ao sistema</h2>
<label>E-mail</label><input id="le" type="email" autocomplete="username">
<label style="margin-top:10px">Senha</label><input id="lp" type="password" autocomplete="current-password">
<div style="margin-top:12px"><button class="btn p" id="li">Entrar</button><span class="msg" id="lm" style="color:var(--no)"></span></div>
</section>
<div id="app" class="hide">
<header><img class="logo" src="logo.png" alt="Grupo J Auto App">
<nav><button id="t1" class="on">Painel</button><button id="t2">Cadastro</button><button id="lo">Sair</button></nav></header>

<section id="v1">
<div class="stats" id="stats"></div>
<div class="card">
<h2>Produtos em negociação</h2>
<div class="bar"><input id="q" placeholder="Buscar produto, observação ou cliente…"><select id="fs"><option value="">Todos os status</option><option value="disponivel">Disponível</option><option value="reservado">Reservado</option><option value="vendido">Vendido</option></select></div>
<div class="sc"><table><thead><tr><th>Produto</th><th>Observações</th><th>Valor</th><th>Cliente</th><th>Status</th><th></th></tr></thead><tbody id="tb"></tbody></table></div>
</div>
</section>

<section id="v2" class="hide">
<div class="card"><h2>Cadastrar cliente</h2>
<div class="g">
<div><label>Nome *</label><input id="cn"></div><div><label>Telefone</label><input id="ct" inputmode="tel"></div>
<div><label>E-mail</label><input id="ce" type="email"></div><div><label>Cidade</label><input id="cc"></div></div>
<div style="margin-top:10px"><label>Observações</label><textarea id="co" rows="2"></textarea></div>
<div style="margin-top:12px"><button class="btn p" id="sc">Salvar cliente</button><span class="msg" id="m1"></span></div>
</div>

<div class="card"><h2>Cadastrar produto</h2>
<div class="g">
<div><label>Cliente (dono) *</label><select id="vc"></select></div>
<div><label>Nome do produto *</label><input id="vm"></div>
<div><label>Valor (R$)</label><input id="vv" type="number" inputmode="decimal"></div>
<div><label>Status</label><select id="vs"><option value="disponivel">Disponível</option><option value="reservado">Reservado</option><option value="vendido">Vendido</option></select></div></div>
<div style="margin-top:10px"><label>Observações</label><textarea id="vo" rows="2"></textarea></div>
<div style="margin-top:12px"><button class="btn p" id="sv">Salvar produto</button><span class="msg" id="m2"></span></div>
</div>

<div class="card"><h2>Clientes cadastrados</h2><div class="sc"><table style="min-width:520px"><tbody id="cl"></tbody></table></div></div>
</section>
<div class="foot">Grupo J · Auto App</div>
</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
function showErr(m){var e=document.getElementById("lm");if(e)e.textContent="Erro: "+m;console.error(m)}
window.onerror=function(m){showErr(m)};
window.onunhandledrejection=function(ev){showErr((ev.reason&&ev.reason.message)||ev.reason)};
var D={clientes:[],veiculos:[]},db=null,pend={};
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function quem(e){return String(e).split("@")[0]}
function brl(n){return n===""||n==null||isNaN(n)?"–":Number(n).toLocaleString("pt-BR",{style:"currency",currency:"BRL"})}
var sb=window.supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_KEY);
function err(e){alert("Erro: "+((e&&e.message)||e))}
async function load(){
  var a=await sb.from("clientes").select("*").order("nome");
  var b=await sb.from("produtos").select("*").order("created_at",{ascending:false});
  if(a.error||b.error){err(a.error||b.error);return}
  D.clientes=a.data;
  D.veiculos=b.data.map(function(p){return{id:p.id,clienteId:p.cliente_id,nome:p.nome,preco:p.valor,obs:p.obs,status:p.status,criadoPor:p.criado_por}});
  render();
}
async function put(col,obj){
  var r;
  if(col==="clientes"){r=await sb.from("clientes").upsert(obj)}
  else{var o={cliente_id:obj.clienteId,nome:obj.nome,valor:(obj.preco===""||obj.preco==null)?null:obj.preco,obs:obj.obs,status:obj.status};if(obj.id)o.id=obj.id;r=await sb.from("produtos").upsert(o)}
  if(r.error)err(r.error);
  await load();
}
async function del(col,id){
  var r=await sb.from(col==="clientes"?"clientes":"produtos").delete().eq("id",id);
  if(r.error)err(r.error);
  await load();
}
function cli(id){return D.clientes.find(function(c){return c.id===id})}
var SL={disponivel:"Disponível",reservado:"Reservado",vendido:"Vendido"};

function render(){
  var v=D.veiculos,n=function(s){return v.filter(function(x){return x.status===s}).length};
  $("stats").innerHTML=[["Disponíveis",n("disponivel")],["Reservados",n("reservado")],["Vendidos",n("vendido")],["Clientes",D.clientes.length]]
    .map(function(a){return '<div class="st"><b>'+a[1]+'</b><span>'+a[0]+'</span></div>'}).join("");
  var q=$("q").value.toLowerCase().trim(),fs=$("fs").value;
  var rows=v.filter(function(x){
    var c=cli(x.clienteId)||{},t=[x.nome,x.marca,x.modelo,x.obs,c.nome].join(" ").toLowerCase();
    return(!q||t.indexOf(q)>-1)&&(!fs||x.status===fs)
  }).sort(function(a,b){return(a.status==="disponivel"?0:1)-(b.status==="disponivel"?0:1)||String(a.nome||a.marca).localeCompare(String(b.nome||b.marca))});
  $("tb").innerHTML=rows.length?rows.map(function(x){
    var c=cli(x.clienteId)||{nome:"(removido)"};
    return '<tr><td><b>'+esc(x.nome||((x.marca||"")+" "+(x.modelo||"")))+'</b>'+(x.criadoPor?'<br><span class="by" title="'+esc(x.criadoPor)+'">por '+esc(quem(x.criadoPor))+'</span>':'')+'</td>'
    +'<td><small>'+esc(x.obs||"")+'</small></td>'
    +'<td><b>'+brl(x.preco)+'</b></td>'
    +'<td>'+esc(c.nome)+'<br><small>'+esc(c.telefone||"")+'</small></td>'
    +'<td><button class="tag '+x.status+'" data-st="'+x.id+'" title="Clique para mudar">'+SL[x.status]+'</button></td>'
    +'<td><button class="x" data-dv="'+x.id+'">'+(pend[x.id]?"Confirmar?":"Excluir")+'</button></td></tr>'
  }).join(""):'<tr><td colspan="6" class="vz">Nenhum produto encontrado. Use a aba Cadastro para adicionar.</td></tr>';
  $("cl").innerHTML=D.clientes.length?D.clientes.map(function(c){
    var k=v.filter(function(x){return x.clienteId===c.id}).length;
    return '<tr><td><b>'+esc(c.nome)+'</b><br><small>'+esc([c.telefone,c.email,c.cidade].filter(Boolean).join(" · "))+'</small>'+(c.criado_por?'<br><span class="by" title="'+esc(c.criado_por)+'">por '+esc(quem(c.criado_por))+'</span>':'')+'</td><td><small>'+k+' produto(s)</small></td>'
    +'<td><button class="x" data-dc="'+c.id+'">'+(pend[c.id]?"Confirmar?":"Excluir")+'</button></td></tr>'
  }).join(""):'<tr><td class="vz">Nenhum cliente ainda.</td></tr>';
  var sel=$("vc"),cur=sel.value;
  sel.innerHTML='<option value="">Selecione…</option>'+D.clientes.map(function(c){return '<option value="'+c.id+'">'+esc(c.nome)+'</option>'}).join("");
  sel.value=cur;
}
function ask(id,fn){if(pend[id]){delete pend[id];fn()}else{pend[id]=1;render();setTimeout(function(){delete pend[id];render()},3000)}}
document.addEventListener("click",function(e){
  var t=e.target,id;
  if(id=t.getAttribute("data-st")){var x=D.veiculos.find(function(v){return v.id===id}),o=["disponivel","reservado","vendido"];
    put("veiculos",Object.assign({},x,{status:o[(o.indexOf(x.status)+1)%3]}))}
  else if(id=t.getAttribute("data-dv"))ask(id,function(){del("veiculos",id)});
  else if(id=t.getAttribute("data-dc"))ask(id,function(){
    D.veiculos.filter(function(v){return v.clienteId===id}).forEach(function(v){del("veiculos",v.id)});del("clientes",id)});
});
function tab(n){$("v1").classList.toggle("hide",n!==1);$("v2").classList.toggle("hide",n!==2);$("t1").classList.toggle("on",n===1);$("t2").classList.toggle("on",n===2)}
$("t1").onclick=function(){tab(1)};$("t2").onclick=function(){tab(2)};
["q","fs"].forEach(function(i){$(i).oninput=render});
function flash(id){$(id).textContent="✓ Salvo";setTimeout(function(){$(id).textContent=""},2500)}
$("sc").onclick=function(){
  var nome=$("cn").value.trim();if(!nome){$("cn").focus();return}
  put("clientes",{nome:nome,telefone:$("ct").value.trim(),email:$("ce").value.trim(),cidade:$("cc").value.trim(),obs:$("co").value.trim()}).then(function(){
    ["cn","ct","ce","cc","co"].forEach(function(i){$(i).value=""});flash("m1")});
};
$("sv").onclick=function(){
  if(!$("vc").value){$("vc").focus();return}
  if(!$("vm").value.trim()){$("vm").focus();return}
  put("veiculos",{clienteId:$("vc").value,nome:$("vm").value.trim(),obs:$("vo").value.trim(),preco:$("vv").value,status:$("vs").value}).then(function(){
    ["vm","vo","vv"].forEach(function(i){$(i).value=""});flash("m2")});
};
async function gate(){
  var r=await sb.auth.getSession();
  var on=!!(r.data&&r.data.session);
  $("lg").classList.toggle("hide",on);$("app").classList.toggle("hide",!on);
  if(on)load();
}
$("li").onclick=async function(){
  $("lm").textContent="";
  var r=await sb.auth.signInWithPassword({email:$("le").value.trim(),password:$("lp").value});
  if(r.error){$("lm").textContent="  E-mail ou senha incorretos";return}
  $("lp").value="";gate();
};
$("lp").onkeydown=function(e){if(e.key==="Enter")$("li").click()};
$("lo").onclick=async function(){await sb.auth.signOut();D={clientes:[],veiculos:[]};gate()};
setInterval(function(){if(!$("app").classList.contains("hide"))load()},30000);
gate();
</script>
</body>
</html>
